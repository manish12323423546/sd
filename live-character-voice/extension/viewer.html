<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>Live Character Voice — Synced viewer</title><link rel="stylesheet" href="style.css" />
<style>
  body { height: 100vh; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); background: rgba(6,8,12,.7); }
  header img { width:26px; height:26px; border-radius:8px; }
  main { display:grid; grid-template-columns: 1fr 360px; gap:14px; padding:14px; min-height:0; }
  .stage { position:relative; background:#000; border-radius:18px; overflow:hidden; border:1px solid var(--line); }
  video { width:100%; height:100%; object-fit:contain; background:#000; }
  .badge-live { position:absolute; left:12px; top:12px; display:flex; gap:6px; align-items:center; font:800 11px Inter; letter-spacing:.08em;
    padding:4px 10px; border-radius:999px; background: rgba(139,108,255,.9); }
  .badge-live i { width:6px; height:6px; border-radius:50%; background:#fff; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity:.25 } }
  .overlay { position:absolute; inset:0; display:grid; place-items:center; background: rgba(0,0,0,.72); backdrop-filter: blur(4px); text-align:center; }
  .count { font: 600 56px Sora, Inter, sans-serif; }
  .sub { position:absolute; left:50%; bottom:7%; transform:translateX(-50%); max-width:84%; background: rgba(0,0,0,.78); padding:9px 16px;
    border-radius:12px; font: 600 clamp(14px,1.7vw,22px)/1.35 Inter, sans-serif; text-align:center; opacity:0; transition: opacity .15s; }
  .sub span { font-size:.72em; letter-spacing:.08em; text-transform:uppercase; margin-right:10px; }
  aside { display:flex; flex-direction:column; gap:12px; min-height:0; }
  .spk { display:grid; grid-template-columns: 12px 1fr; gap:6px 8px; align-items:center; padding:8px 0; }
  .lines { overflow-y:auto; flex:1; min-height:120px; }
  .ln { padding:6px 4px; border-bottom:1px solid var(--line); font-size:12.5px; }
  .ln b { margin-right:6px; } .ln .t { color: var(--muted); font-family: "JetBrains Mono", monospace; font-size:11px; margin-right:6px; }
  .emo { font-size:9.5px; font-weight:700; text-transform:uppercase; padding:1px 5px; border-radius:4px; border:1px solid; margin-right:6px; }
  .bar { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:10px 14px; margin-top:10px; }
  .stats { display:flex; gap:14px; font-family:"JetBrains Mono", monospace; font-size:12px; color: var(--muted); }
  .stats b { color: var(--ink); }
  .left { display:flex; flex-direction:column; min-height:0; }
</style></head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" />
    <div style="flex:1"><h1 style="font-size:14px">Synced viewer</h1><div id="src" class="muted" style="font-size:11.5px">connecting…</div></div>
    <span class="muted" style="font-size:11.5px"><kbd>Space</kbd> mute voices · <kbd>F</kbd> full screen</span>
  </header>
  <main>
    <div class="left">
      <div class="stage" id="stage" style="flex:1">
        <video id="video" playsinline muted></video>
        <div class="badge-live" id="badge" style="display:none"><i></i><span id="badgeText">SYNCED</span></div>
        <div class="sub" id="sub"><span id="subWho"></span><span id="subText" style="font-size:1em;letter-spacing:0;text-transform:none;margin:0"></span></div>
        <div class="overlay" id="wait"><div><div class="count" id="count">…</div><div class="muted" id="waitText">Starting the capture…</div></div></div>
      </div>
      <div class="panel bar">
        <button id="stop" class="btn btn-stop">■ Stop</button>
        <div class="stats"><span>heard <b id="sSent">0 s</b></span><span>voiced <b id="sVoiced">0</b></span><span>late <b id="sLate">0</b></span><span>felt delay <b id="sDelay">–</b></span></div>
        <label class="row muted" style="margin-left:auto;width:160px">Original <input id="orig" type="range" min="0" max="1" step="0.05" value="0.35" /></label>
        <label class="row muted" style="width:150px">Voices <input id="voice" type="range" min="0" max="1.5" step="0.05" value="1" /></label>
      </div>
    </div>
    <aside>
      <div class="panel" style="padding:12px"><div class="eyebrow">Commentators</div><div id="spk"><p class="muted">Listening for the first commentator…</p></div></div>
      <div class="panel" style="padding:12px;display:flex;flex-direction:column;min-height:0;flex:1"><div class="eyebrow" style="margin-bottom:6px">Live transcript</div><div class="lines" id="lines"></div></div>
    </aside>
  </main>
  <script src="lib/live-core.js"></script>
  <script src="viewer.js"></script>
</body></html>
